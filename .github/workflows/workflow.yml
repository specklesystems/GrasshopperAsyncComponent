name: .NET Build and Publish

on:
  pull_request:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    env:
      SOLUTION_NAME: "GrasshopperAsyncComponent.slnx"
    runs-on:
      ubuntu-latest
      # 👇 Conditionally assign environment (empty string = no environment)
    environment: ${{ github.ref_type == 'tag' && 'nuget.org' || '' }}
    permissions:
      id-token: write # enable GitHub OIDC token issuance for this job
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.x.x # Keep aligned with global.json

      - id: 🔢 set-version
        name: Set version to output
        shell: bash
        run: |
          TAG=${REF_NAME}
          if [[ "${REF}" != refs/tags/* ]]; then
            TAG="0.0.0"
          fi
          SEMVER="$TAG"
          FILE_VERSION=$(echo "$TAG" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          FILE_VERSION="$FILE_VERSION.${RUN_NUMBER}"

          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "file-version=$FILE_VERSION" >> "$GITHUB_OUTPUT"

          echo $SEMVER
          echo $FILE_VERSION
        env:
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}

      - name: 📦 Tool Restore
        run: dotnet tool restore

      - name: 📄 Format
        run: dotnet csharpier check .

      - name: 📦 restore
        run: dotnet restore ${{env.SOLUTION_NAME}}

      - name: 🏗️ build
        run: |
          dotnet build ${{env.SOLUTION_NAME}} \
          --configuration release \
          --no-restore \
          -warnaserror \
          -p:Version=${{steps.set-version.outputs.semver}} \
          -p:FileVersion=${{steps.set-version.outputs.fileVersion}}

      - name: 🎁 pack
        run: dotnet pack ${{env.SOLUTION_NAME}} --no-build -p:Version=${{steps.set-version.outputs.semver}} -p:FileVersion=${{steps.set-version.outputs.fileVersion}}

      - name: 🔓 NuGet login (OIDC → temp API key)
        if: (github.ref_type == 'tag')
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: ⬆️ Push to nuget.org
        if: (github.ref_type == 'tag')
        run: dotnet nuget push **/*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key ${{steps.login.outputs.NUGET_API_KEY}}
