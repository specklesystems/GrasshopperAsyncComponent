version: 2
updates:
  # Pin updates of the shared workflows in specklesystems/.github, one pull
  # request per new tag there, with no cooldown. Another repo of the org takes
  # a new pin first; this repo merges its update after the changed workflows
  # worked there.
  # Dependabot security updates are off in this repo, so `allow` keeps this
  # entry to those pins. The cooldown block then covers nothing; zizmor's
  # dependabot-cooldown audit asks for it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: specklesystems/.github/*
    groups:
      dot-github:
        patterns:
          - specklesystems/.github/*
    cooldown:
      default-days: 7
      exclude:
        - specklesystems/.github/*
